name: Deploy Athenas 🇫🇷 para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # A chave da IA entra só aqui, como secret — o prepare regenera
      # o payload codificado com semente aleatória a cada deploy
      # (rotação por build). Sem o secret, o fallback commitado é usado.
      - name: Build + Typecheck + Test
        env:
          ATHENAS_OLLAMA_KEY: ${{ secrets.ATHENAS_OLLAMA_KEY }}
        run: |
          npm run build
          npm run typecheck
          npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
